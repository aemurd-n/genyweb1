<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Background square -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Neural network icon -->
  <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input nodes -->
    <circle cx="14" cy="20" r="4" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="14" cy="32" r="4" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="14" cy="44" r="4" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Connections to hidden node -->
    <line x1="18" y1="20" x2="30" y2="30"/>
    <line x1="18" y1="32" x2="30" y2="32"/>
    <line x1="18" y1="44" x2="30" y2="34"/>
    <!-- Hidden node -->
    <circle cx="32" cy="32" r="5" fill="#ffffff" fill-opacity="0.3"/>
    <!-- Connection to output -->
    <line x1="37" y1="32" x2="46" y2="32"/>
  </g>

  <!-- Output / AI pulse -->
  <circle cx="52" cy="32" r="8" fill="#ffffff"/>
  <circle cx="52" cy="32" r="12" fill="#ffffff" fill-opacity="0.15"/>
  <text x="52" y="36" font-family="Arial, sans-serif" font-size="8" font-weight="800"
        fill="#0D47A1" text-anchor="middle">AI</text>
</svg>
